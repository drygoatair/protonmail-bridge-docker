x-arcane:
  icon: https://pmecdn.protonweb.com/image-transformation/?s=c&image=image/upload/v1776940263/static/logos/bridge/bridge-badge.svg
  urls:
    - https://github.com/shenxn/protonmail-bridge-docker
    - https://github.com/drygoatair/protonmail-bridge-docker

services:
  protonmail-bridge:
    build: ./build
    image: protonmail-bridge:latest
    ports:
      - 1025:25/tcp
      - 1143:143/tcp
    restart: unless-stopped
    volumes:
      - protonmail:/root

volumes:
  protonmail:
    name: protonmail

networks:
  protonmail-network:
    name: protonmail-network